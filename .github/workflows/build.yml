name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4
    strategy:
      matrix:
        oled: [sh1106, ssd1306]
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware (esp32s3, ${{ matrix.oled }})
        run: |
          . $IDF_PATH/export.sh
          cd firmware
          idf.py set-target esp32s3
          if [ "${{ matrix.oled }}" = "ssd1306" ]; then
            sed -i '/CONFIG_DISPLAY_CONTROLLER_/d' sdkconfig
            echo "CONFIG_DISPLAY_CONTROLLER_SSD1306=y" >> sdkconfig
          fi
          idf.py build

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: esp32_kb-${{ matrix.oled }}
          path: |
            firmware/build/esp32_kb.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
          if-no-files-found: error
